<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Huisoverzicht Demo</title><meta name="huis-versie" content="80">
<style>
/* @bron style.css */
:root{
  color-scheme: dark;
  --bg:#0d1217; --panel:#141b22; --panel2:#1a232b; --line:#26323c;
  --text:#e6ebee; --muted:#8a99a5; --faint:#5d6c78;
  --lamp:#ffc46b; --hum:#62b6de; --warn:#f08a5d; --ok:#8fd17a; --cold:#6f9df0;
  --display:"Sora", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:14px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px 16px;transition:grid-template-columns .25s ease, gap .25s ease}
.app.side-closed{grid-template-columns:minmax(0,1fr) 0px;gap:0}
.app.side-closed .panel{visibility:hidden}
.sidetab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;width:22px;height:64px;border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;background:rgba(20,27,34,.9);color:var(--muted);cursor:pointer;padding:0;font-size:13px}
.sidetab:hover{color:var(--text)}
.card > .eyebrow:first-child{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;user-select:none}
.card > .eyebrow:first-child::after{content:"–";font-size:14px;line-height:1;color:var(--faint)}
.card.min > .eyebrow:first-child::after{content:"+"}
.card.min > .eyebrow:first-child{margin-bottom:0}
.card.min > :not(:first-child){display:none!important}
.card > .eyebrow:first-child:hover::after{color:var(--text)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0f14;border:1px solid var(--line);min-height:320px}
#c{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}

.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{background:rgba(20,27,34,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.conn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.conn.ok::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.conn.bad::before{background:var(--warn)}
.tokenbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:6;display:flex;flex-direction:column;gap:10px}
.tokenbox p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.tokenbox input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font:inherit}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.seg{display:flex;background:rgba(20,27,34,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

.tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.tools > *{pointer-events:auto}
.chipbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(20,27,34,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.chipbtn select{background:transparent;border:0;color:var(--text);font:inherit;cursor:pointer}
.chipbtn select option{background:var(--panel)}
.hint{margin-left:auto;color:var(--faint);font-size:11px}

.label{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(13,18,23,.82);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;font-size:11px;line-height:1.3;transition:border-color .2s}
.label b{display:block;font-family:var(--display);font-weight:600;font-size:11px;color:var(--text)}
.label span{font-family:var(--mono);color:var(--muted)}
.label .t{color:var(--text)}
.label:hover{z-index:3}
.label.sel{border-color:var(--lamp);z-index:2}
.label.warn{border-color:var(--warn)}
.label.out{border-style:dashed}
.label.kompas{pointer-events:none;cursor:default;transform:translate(-50%,-50%);width:26px;height:26px;padding:0;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:rgba(13,18,23,.78);border-color:var(--lamp);color:var(--lamp)}
.label.nlabel{pointer-events:none;border-width:1.5px}
.label.gevel{pointer-events:none;cursor:default;background:rgba(13,18,23,.6);border-color:#6b5a2e;color:var(--lamp);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px}

.panel{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat strong{font-family:var(--mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--mono)}

.detail h2{margin:0;font-size:20px;letter-spacing:-.01em}
.detail .sub{color:var(--muted);font-size:12px;margin-top:2px}
.readings{display:flex;gap:18px;margin:12px 0 4px}
.readings div small{display:block;color:var(--muted);font-size:11px}
.readings strong{font-family:var(--mono);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.setpoint{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-top:10px}
.setpoint span{font-size:12px;color:var(--muted)}
.setpoint{flex-wrap:wrap}
.setpoint .ctl{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.setpoint button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.spark{margin-top:12px}
.spark svg{width:100%;height:auto;display:block}
.spark .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}

.lamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lampbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12px}
.lampbtn i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.lampctl{margin-top:10px;background:var(--panel2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.lampctl .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.lampctl select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:12px;padding:4px 6px;max-width:190px}
.lampctl .bri{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lampctl input[type=range]{flex:1;accent-color:var(--lamp)}
.lampctl .sw8{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lampctl .sw8 button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.lampctl .sw8 button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.lampctl .sw8 input[type=color]{width:30px;height:28px;border:0;background:none;padding:0;cursor:pointer}
.lampctl small{font-size:11px;color:var(--faint)}
.grp{display:grid;grid-template-columns:1fr auto 34px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.grp .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grp-n{background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer;padding:0}
.lampbtn[aria-pressed="true"]{border-color:var(--lamp)}
.lampbtn[aria-pressed="true"] i{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}

.floorhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px}
.floorhead:first-of-type{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto auto 34px;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--lamp)}
.row .n{font-size:13px}
.row .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.row .h{color:var(--hum)}
.row .h.warn{color:var(--warn)}
.sw{width:34px;height:20px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--faint);transition:transform .15s,background .15s}
.sw[aria-pressed="true"]{border-color:var(--lamp)}
.sw[aria-pressed="true"]::after{transform:translateX(14px);background:var(--lamp)}

.alerts{display:flex;flex-direction:column;gap:6px}
.alert{font-size:12px;border-left:3px solid var(--warn);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0}
.alert.cold{border-color:var(--cold)}
.alert.crit{border-color:#e5484d;background:rgba(229,72,77,.12)}
.alert.tip{border-color:var(--lamp)}
.alert.info{border-color:var(--cold)}
.alert{display:flex;gap:8px;align-items:flex-start}
.alert .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.hpu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.hpu div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.hpu small{display:block;color:var(--muted);font-size:10px}
.hpu b{font-family:var(--mono);font-weight:500;font-size:14px}
.hph{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}
.alert.none{border-color:var(--ok);color:var(--muted)}
.lblpanel{position:absolute;left:12px;bottom:60px;width:min(300px,calc(100% - 24px));max-height:calc(100% - 140px);overflow-y:auto;background:rgba(20,27,34,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:5;display:flex;flex-direction:column;gap:10px}
.lblpanel[hidden]{display:none}
.lblpanel h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lblpanel .grp{display:flex;flex-direction:column;gap:2px}
.lblpanel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 2px;cursor:pointer;border-radius:6px}
.lblpanel label:hover{background:var(--panel2)}
.lblpanel input{accent-color:var(--lamp);width:15px;height:15px;margin:0}
.lblpanel .master{font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px}
.lblpanel .sub{padding-left:14px}
#detpanel,#flowpanel{text-align:left}#detpanel .grp,#flowpanel .grp{align-items:stretch}#detpanel label,#flowpanel label{justify-content:flex-start;text-align:left;align-self:stretch}
.lblpanel .row2{display:flex;gap:6px;flex-wrap:wrap}
.lblpanel .mini{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.lblpanel.off .grp:not(.master-grp){opacity:.45}
#esvg{width:100%;height:auto;display:block;overflow:visible}
#esvg .fl{fill:none;stroke-linecap:round;stroke-dasharray:3 7;animation:eflow 1s linear infinite}
#esvg .fl.rev{animation-direction:reverse}
#esvg .fl.idle{animation:none;stroke-dasharray:none;opacity:.18}
#esvg .base{fill:none;stroke:var(--line);stroke-width:2}
#esvg text{font-family:var(--mono);font-size:11px;fill:var(--text)}
#esvg .nm{font-family:var(--display);font-size:10px;fill:var(--muted)}
@keyframes eflow{to{stroke-dashoffset:-20}}
.etoday{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:8px}
.elabel{border-color:#6b5a2e}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.mini[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.tvpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin-top:8px}
.tvpad .mini{padding:6px 0}
.plug{display:grid;grid-template-columns:1fr auto 34px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.plug:last-child{border-bottom:0}
.plug .lock{display:inline-block;margin-left:6px;font-size:10px;font-family:var(--mono);color:var(--lamp);border:1px solid #6b5a2e;border-radius:999px;padding:0 6px;vertical-align:1px}
.plug .sw.locked{opacity:.4;cursor:not-allowed}
.plughead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.plughead .eyebrow{margin:0}
.modal{position:fixed;inset:0;background:rgba(5,8,11,.62);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .box{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.modal h3{margin:0;font-size:15px}
.modal p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.modal .btns button{border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.modal .btns .ok{background:var(--warn);border-color:var(--warn);color:#1a0f08;font-weight:600}
.plug .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ #esvg .fl{animation:none} }
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.legend .bar{flex:1;height:8px;border-radius:4px}

.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

@media (max-width: 860px){
  .app.side-closed{grid-template-columns:1fr}
  .app.side-closed .panel{display:none}
  .sidetab{top:auto;bottom:70px;transform:none}
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:62vh;min-height:360px}
  .panel{overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .sw::after{transition:none} }
.versie{font-size:11px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:.02em}
/* @bron-einde */
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D-weergave van de begane grond">
    <button class="sidetab" id="sidetab" aria-controls="panel" aria-expanded="true" title="Zijbalk inklappen">›</button>
    <canvas id="c"></canvas>
    <div class="loading" id="loading">3D-model laden…</div>
    <div id="labels"></div>
    <div class="lblpanel" id="lblpanel" hidden></div>
    <div class="lblpanel" id="flowpanel" hidden></div>
    <div class="lblpanel" id="detpanel" hidden></div>
    <div class="topbar">
      <div class="brand">
        <h1>Huisoverzicht <small class="versie" title="Versie van het huisoverzicht">demo · v80</small></h1>
        <p><span class="conn" id="connstate">Demo · gesimuleerde data</span></p>
      </div>
      <div class="seg" role="group" aria-label="Weergave">
        <button id="f-k" data-mode="-1" aria-pressed="false">Kelder</button>
        <button id="f-0" data-mode="0" aria-pressed="true">Begane grond</button>
        <button id="f-1" data-mode="1" aria-pressed="false">Verdieping</button>
        <button id="f-2" data-mode="2" aria-pressed="false">Buitenkant</button>
      </div>
    </div>
    <div class="tools">
      <button class="chipbtn" id="rotate" aria-pressed="true">⟳ Automatisch draaien</button>
      <button class="chipbtn" id="night" aria-pressed="true" title="Licht: automatisch volgens de zon, altijd dag of altijd avond">☼ Auto</button>
      <label class="chipbtn" title="Schuif door de dag om zon en schaduw te zien">Tijd <input type="range" id="simtime" min="0" max="1435" step="5" aria-label="Tijdstip" style="width:90px;accent-color:var(--lamp)"> <b id="simlbl" style="font-family:var(--mono);font-weight:500">nu</b></label>
      <label class="chipbtn" id="cloudchip" title="Bewolking (live uit Home Assistant als er een weer-entiteit is)">Wolken <input type="range" id="cloud" min="0" max="100" step="5" value="30" aria-label="Bewolking" style="width:70px;accent-color:var(--lamp)"> <b id="cloudlbl" style="font-family:var(--mono);font-weight:500">30%</b></label>
      <label class="chipbtn">Vloer:
        <select id="colormode">
          <option value="temp">temperatuur</option>
          <option value="hum">luchtvochtigheid</option>
          <option value="none">neutraal</option>
        </select>
      </label>
      <label class="chipbtn">Muren:
        <select id="wallmode">
          <option value="solid">massief</option>
          <option value="wire">wireframe</option>
        </select>
      </label>
      <button class="chipbtn" id="reset">Beeld resetten</button>
      <button class="chipbtn" id="flowbtn" aria-pressed="false" aria-expanded="false" aria-controls="flowpanel" title="Stroom, netwerk en water tonen">⚡ Stromen</button>
      <button class="chipbtn" id="kostbtn" aria-pressed="false" title="Kosten van stroom en water tonen (totaal en per verbruiker)">€ Kosten</button>
      <button class="chipbtn" id="xraybtn" aria-pressed="false" title="Alle apparaten, stekkers en putten zichtbaar door muren, dak en grond heen">◎ Apparaten</button>
      <button class="chipbtn" id="detbtn" aria-expanded="false" aria-controls="detpanel" title="Details uitzetten maakt de weergave sneller">◐ Details</button>
      <button class="chipbtn" id="lblbtn" aria-expanded="false" aria-controls="lblpanel" aria-pressed="true">▤ Labels</button>
      <span class="hint">Sleep om te draaien · scroll om te zoomen · klik op een lamp of kamer</span>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div class="card" id="statcard">
      <p class="eyebrow">Nu in huis · <span id="clock">--:--</span></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card" id="netcard"></div>
    <div class="card" id="energycard">
      <p class="eyebrow">Energie nu</p>
      <svg id="esvg" viewBox="0 0 300 150" role="img" aria-label="Energiestromen tussen zon, batterij, net en huis"></svg>
      <div class="etoday" id="etoday"></div>
    </div>
    <div class="card" id="kostcard" hidden></div>
    <div class="card" id="hpcard"></div>
    <div class="card detail" id="detail"></div>
    <div class="card" id="groupcard"></div>
    <div class="card" id="alertcard">
      <p class="eyebrow">Meldingen &amp; tips</p>
      <div class="alerts" id="alerts"></div>
    </div>
    <div class="card" id="listcard">
      <p class="eyebrow">Alle ruimtes</p>
      <div id="list"></div>
      <div class="legend" id="legend" style="margin-top:12px"></div>
    </div>
  </aside>
</div>

<div class="modal" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-t" hidden><div class="box"><h3 id="confirm-t"></h3><p></p><div class="btns"><button class="no" type="button">Annuleren</button><button class="ok" type="button">OK</button></div></div></div>

function scale(stops,v){
  if(v<=stops[0][0]) return new THREE.Color(stops[0][1]);
  for(let i=1;i<stops.length;i++){
    if(v<=stops[i][0]){
      const [a,ca]=stops[i-1],[b,cb]=stops[i];
      return new THREE.Color(ca).lerp(new THREE.Color(cb),(v-a)/(b-a));
    }
  }
  return new THREE.Color(stops[stops.length-1][1]);
}

function makeShingleTex(){
  const S = 512, CH = 64, c = document.createElement('canvas'); c.width = S; c.height = S; const g = c.getContext('2d');
  let seed = 11; const rnd = ()=>{ seed = (seed*16807) % 2147483647; return seed/2147483647; };
  const tones = ['#9a5a3a','#a4623f','#935536','#ab6843','#8c5033','#a15d3b','#b06d47','#96583a','#874c30'].map((c,i)=>'#'+new THREE.Color(c).lerp(new THREE.Color(0x8d8883), 0.38 + (i%3)*0.06).getHexString());   // (v61) verweerd: grijzer
  g.fillStyle = '#2e1a10'; g.fillRect(0,0,S,S);
  for(let row=0; row<S/CH; row++){
    const y0 = row*CH, widths = []; let rem = S;
    while(rem>0){ let w = Math.min(rem, 34+Math.floor(rnd()*96)); if(rem-w>0 && rem-w<30) w = rem; widths.push(w); rem -= w; }
    let x = Math.floor(rnd()*S);
    widths.forEach(w=>{
      const col = tones[Math.floor(rnd()*tones.length)];
      [x, x-S].forEach(px=>{
        const gr = g.createLinearGradient(0,y0,0,y0+CH); gr.addColorStop(0, shadeHex(col,-0.25)); gr.addColorStop(0.18, col); gr.addColorStop(1, shadeHex(col,0.06));
        g.fillStyle = gr; g.fillRect(px+1.5, y0, w-3, CH-2);
        g.strokeStyle = 'rgba(40,20,10,.16)'; g.lineWidth = 1;
        for(let k=0;k<3;k++){ const gx = px+4+rnd()*(w-8); g.beginPath(); g.moveTo(gx,y0+6); g.lineTo(gx+rnd()*3-1.5,y0+CH-3); g.stroke(); }
      });
      x = (x + w) % S;
    });
    g.fillStyle = 'rgba(20,10,5,.55)'; g.fillRect(0, y0+CH-3, S, 3);        // schaduwlijn onder de onderrand
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

  const gm = mesh.geometry, p = gm.attributes.position, n = gm.attributes.normal, uv = gm.attributes.uv; if(!p || !n || !uv) return;
  const o = localOnly ? {x:0,y:0,z:0} : mesh.position;

    const x = p.getX(i)+o.x, y = p.getY(i)+o.y, z = p.getZ(i)+o.z;

}

function slabGeo(a,b,c,d,hole){
  const sh = new THREE.Shape();
  sh.moveTo(mx(a),-mz(b)); sh.lineTo(mx(c),-mz(b)); sh.lineTo(mx(c),-mz(d)); sh.lineTo(mx(a),-mz(d)); sh.lineTo(mx(a),-mz(b));

  const g = new THREE.ExtrudeGeometry(sh,{depth:0.15, bevelEnabled:false, curveSegments:32});

  return g;
}

{

  const gGeo = new THREE.ExtrudeGeometry(shape,{depth:0.28, bevelEnabled:false});
  gGeo.rotateY(-Math.PI/2);   // shape-x → Z, extrusie → -X

function ortho(pts){
  const P = [pts[0].clone()];
  for(let i=1;i<pts.length;i++){ const a = P[P.length-1], b = pts[i];
    const n = [a.x!==b.x, a.y!==b.y, a.z!==b.z].filter(Boolean).length;
    if(n > 1 && !b.userData_free){ const q1 = new THREE.Vector3(a.x, b.y, a.z), q2 = new THREE.Vector3(b.x, b.y, a.z); [q1,q2].forEach(q=>{ if(!q.equals(P[P.length-1])) P.push(q); }); }
    if(!b.equals(P[P.length-1])) P.push(b.clone()); }
  const cp = new THREE.CurvePath(); for(let i=1;i<P.length;i++) cp.add(new THREE.LineCurve3(P[i-1], P[i])); return cp;
}

function lampCtlHTML(r){

// kleur/helderheid toepassen; per lamp alleen wat die lamp kan
function applyLook(ls, patch){
  const ents = {bri:new Set(), k:new Set(), rgb:new Set(), on:new Set()};
  ls.forEach(x=>{
    const p = {};
    if(patch.bri!=null && lampCanDim(x)){ p.bri = patch.bri; if(x.ha) ents.bri.add(x.ha); }
    if(patch.cmode==='color_temp' && lampCanTemp(x)){ p.cmode = 'color_temp'; p.kelvin = patch.kelvin; if(x.ha) ents.k.add(x.ha); }
    if(patch.cmode==='rgb' && lampCanColor(x)){ p.cmode = 'rgb'; p.rgb = patch.rgb; if(x.ha) ents.rgb.add(x.ha); }
    Object.assign(x, p); x.on = true; if(x.ha) ents.on.add(x.ha);
  });
  applyLamps(); renderPanel();
  if(!(LIVE && ha)) return;
  const call = (set, data)=>{ if(set.size) ha.call('light','turn_on',{entity_id:[...set], ...data}).catch(()=>{}); };
  if(patch.bri!=null) call(ents.bri, {brightness_pct: Math.max(1, Math.round(patch.bri/2.55))});
  if(patch.cmode==='color_temp') call(ents.k, {color_temp_kelvin: patch.kelvin});
  if(patch.cmode==='rgb') call(ents.rgb, {rgb_color: patch.rgb});
  const rest = [...ents.on].filter(e=>!ents.bri.has(e) && !ents.k.has(e) && !ents.rgb.has(e)); if(rest.length) call(new Set(rest), {});
}

}

function bindCtl(root){

function askConfirm(title, text, okLabel){ return new Promise(res=>{

  const ok = m.querySelector('.ok'), no = m.querySelector('.no');
  ok.hidden = !okLabel; ok.textContent = okLabel || ''; no.textContent = okLabel ? 'Annuleren' : 'Sluiten';
  const done = v=>{ m.hidden = true; document.removeEventListener('keydown', key); res(v); };
  const key = e=>{ if(e.key==='Escape') done(false); };
  ok.onclick = ()=>done(true); no.onclick = ()=>done(false); m.onclick = e=>{ if(e.target===m) done(false); };
  document.addEventListener('keydown', key); m.hidden = false; no.focus();

function sparkSVG(h){

  const x=i=>P+i*(W-2*P)/(h.length-1), y=v=>H-P-(v-min)/(max-min)*(H-2*P);
  const pts=h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const last=h.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperatuurverloop laatste 24 uur">
    <line x1="${P}" x2="${W-P}" y1="${H/2}" y2="${H/2}" stroke="#26323c" stroke-dasharray="3 4"/>
    <path d="M${pts[0]} L${pts.join(' L')} L${x(last)},${H} L${x(0)},${H} Z" fill="rgba(255,196,107,.12)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#ffc46b" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(h[last])}" r="3.5" fill="#ffc46b"/>
  </svg>`;
}

function tick(){
  if(LIVE) return;   // live: alles komt uit Home Assistant
  rooms.forEach(r=>{
    if(r.hasT){ r.temp += (r.target - r.temp)*0.04 + (Math.random()-.5)*0.12; r.hist.push(+r.temp.toFixed(2)); r.hist.shift(); }
    if(r.hasH){ r.hum = Math.max(30, Math.min(85, r.hum + (Math.random()-.5)*1.2 + (55-r.hum)*0.02)); }
  });
  energy.pv = night ? 0 : Math.max(0, Math.min(PV_KWP, energy.pv + (Math.random()-.5)*0.4 || 3.4));
  energy.house = Math.round(650 + rooms.reduce((s,r)=>s+(roomW(r)||0),0) + lampList.filter(l=>l.on).length*6 + rooms.filter(r=>r.ac && r.climState!=='off').length*450 + (Math.random()-.5)*120);
  const pvW = energy.pv*1000;
  let bW = energy.house - pvW;                                   // + = ontladen
  bW = Math.max(-2500, Math.min(2500, bW));
  if(bW>0 && energy.batt<=6) bW = 0; if(bW<0 && energy.batt>=99.5) bW = 0;
  energy.battW = Math.round(bW); energy.grid = Math.round(energy.house - pvW - bW);
  energy.batt = Math.max(5, Math.min(100, energy.batt - bW/9000));

async function getToken(){
  // 1) je bestaande Home Assistant-login (werkt als "Ingelogd blijven" aan staat)
  try{
    const t = JSON.parse(localStorage.getItem('hassTokens')||'null');
    if(t && t.access_token){
      if(t.expires && Date.now() < t.expires - 60000) return t.access_token;
      if(t.refresh_token){
        const body = new URLSearchParams({grant_type:'refresh_token', client_id: t.clientId || (location.origin + '/'), refresh_token: t.refresh_token});
        const res = await fetch('/auth/token', {method:'POST', body});
        if(res.ok){ const j = await res.json(); if(j.access_token) return j.access_token; }
      }
    }
  }catch(e){}
  // 2) een zelf ingesteld langlevend token (alleen op dit apparaat bewaard)
  try{ const t = localStorage.getItem('huis-ha-token'); if(t) return t; }catch(e){}
  return null;
}

    }

const histCache = {};
async function loadHistory(r){

      minimal_response: !!r.t, no_attributes: !!r.t, significant_changes_only:false});
    const rows = (res && res[id]) || [];
    const pts = rows.map(p=>({t:(p.lu ?? p.lc)*1000, v: r.t ? parseFloat(p.s) : (p.a ? p.a.current_temperature : NaN)})).filter(p=>isFinite(p.v));
    if(!pts.length) return;
    const now = Date.now(), h = []; let last = pts[0].v, k = 0;
    for(let i=0;i<24;i++){ const end = now - (23-i)*3600e3; while(k<pts.length && pts[k].t<=end){ last = pts[k].v; k++; } h.push(+last.toFixed(2)); }

}
