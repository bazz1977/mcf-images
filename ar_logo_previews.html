
<style>
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 8px 0; }
.item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.label { font-size: 12px; color: var(--color-text-secondary); }
.btn { width: 32px; height: 32px; border-radius: 5px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); display: grid; place-items: center; cursor: pointer; }
.btn:hover { border-color: var(--color-border-secondary); }
.card-row { display: flex; align-items: center; gap: 5px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 6px; padding: 6px 10px; }
.pill { font-size: 11px; padding: 2px 7px; border-radius: 3px; font-family: var(--font-sans); font-weight: 500; }
.pill-c { background: #e4e4e7; color: #27272a; }
.pill-xp { background: rgba(255,190,0,.15); border: 0.5px solid rgba(255,190,0,.4); color: #d97706; font-size: 10px; padding: 2px 6px; border-radius: 3px; }
.act { font-size: 10px; padding: 3px 7px; border-radius: 4px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); cursor: pointer; font-family: var(--font-sans); }
.act-r { background: #ff3d2e; color: white; border-color: #ff3d2e; }
</style>
