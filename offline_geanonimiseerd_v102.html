    <div class="app">
      <section class="stage" id="stage" aria-label="3D-weergave van de begane grond">

          class="sidetab"
          id="sidetab"
          aria-controls="panel"
          aria-expanded="true"
          title="Zijbalk inklappen"
        >
          ›
        </button>
        <canvas id="c"></canvas>
        <div class="loading" id="loading">3D-model laden…</div>
        <div id="labels"></div>
        <div class="lblpanel" id="lblpanel" hidden></div>
        <div class="lblpanel" id="flowpanel" hidden></div>
        <div class="lblpanel" id="detpanel" hidden></div>
        <div class="topbar">
          <div class="brand">
            <h1>
              Huisoverzicht <small class="versie" title="Versie van het huisoverzicht">demo · v102</small>
            </h1>
            <p><span class="conn" id="connstate">Demo · gesimuleerde data</span></p>
          </div>
          <div class="seg" role="group" aria-label="Weergave">
            <button id="f-k" data-mode="-1" aria-pressed="false">Kelder</button>
            <button id="f-0" data-mode="0" aria-pressed="true">Begane grond</button>
            <button id="f-1" data-mode="1" aria-pressed="false">Verdieping</button>
            <button id="f-2" data-mode="2" aria-pressed="false">Buitenkant</button>
          </div>
        </div>
        <div class="tools">
          <button class="chipbtn" id="rotate" aria-pressed="true">⟳ Automatisch draaien</button>
          <button
            class="chipbtn"
            id="night"
            aria-pressed="true"
            title="Licht: automatisch volgens de zon, altijd dag of altijd avond"
          >
            ☼ Auto
          </button>
          <label class="chipbtn" title="Schuif door de dag om zon en schaduw te zien"
            >Tijd
            <input
              type="range"
              id="simtime"
              min="0"
              max="1435"
              step="5"
              aria-label="Tijdstip"
              style="width: 90px; accent-color: var(--lamp)"
            />
            <b id="simlbl" style="font-family: var(--mono); font-weight: 500">nu</b></label
          >
          <label
            class="chipbtn"
            id="cloudchip"
            title="Bewolking (live uit Home Assistant als er een weer-entiteit is)"
            >Wolken
            <input
              type="range"
              id="cloud"
              min="0"
              max="100"
              step="5"
              value="30"
              aria-label="Bewolking"
              style="width: 70px; accent-color: var(--lamp)"
            />
            <b id="cloudlbl" style="font-family: var(--mono); font-weight: 500">30%</b></label
          >
          <label class="chipbtn"
            >Vloer:
            <select id="colormode">
              <option value="temp">temperatuur</option>
              <option value="hum">luchtvochtigheid</option>
              <option value="none">neutraal</option>
            </select>
          </label>
          <label class="chipbtn"
            >Muren:
            <select id="wallmode">
              <option value="solid">massief</option>
              <option value="wire">wireframe</option>
            </select>
          </label>
          <button class="chipbtn" id="reset">Beeld resetten</button>
          <button
            class="chipbtn"
            id="freecam"
            aria-pressed="false"
            title="Uit: de camera zakt tot op de vloer van de gekozen woonlaag. Aan: helemaal vrij rond het huis, ook eronder door."
          >
            🎥 Vrije camera
          </button>
          <button
            class="chipbtn"
            id="flowbtn"
            aria-pressed="false"
            aria-expanded="false"
            aria-controls="flowpanel"
            title="Stroom, netwerk en water tonen"
          >
            ⚡ Stromen
          </button>
          <button
            class="chipbtn"
            id="kostbtn"
            aria-pressed="false"
            title="Kosten van stroom en water tonen (totaal en per verbruiker)"
          >
            € Kosten
          </button>
          <button
            class="chipbtn"
            id="xraybtn"
            aria-pressed="false"
            title="Alle apparaten, stekkers en putten zichtbaar door muren, dak en grond heen"
          >
            ◎ Apparaten
          </button>
          <button
            class="chipbtn"
            id="detbtn"
            aria-expanded="false"
            aria-controls="detpanel"
            title="Details uitzetten maakt de weergave sneller"
          >
            ◐ Details
          </button>
          <button
            class="chipbtn"
            id="lblbtn"
            aria-expanded="false"
            aria-controls="lblpanel"
            aria-pressed="true"
          >
            ▤ Labels
